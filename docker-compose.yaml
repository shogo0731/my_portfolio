services:
  frontend:
    container_name: frontend
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/frontend
      - node_modules:/frontend/node_modules
    environment:
      - WATCHPACK_POLLING=true
    tty: true
  backend:
    container_name: backend
    build:
      context: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/backend
    tty: true
    depends_on:
      - db
  
  db:
    image: postgres:14
    container_name: postgres-db
    ports:
    - "5432:5432"
    volumes:
     - db-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: 'user'
      POSTGRES_PASSWORD: 'postgres'

volumes:
  node_modules:
  db-data: